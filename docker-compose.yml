services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URL: postgresql://ticketing@db:5432/ticketing
      DB_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - '${PORT:-3000}:3000'
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ticketing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketing -d ticketing']
      interval: 2s
      timeout: 3s
      retries: 15

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./secrets/db_password.example}

volumes:
  pgdata:
